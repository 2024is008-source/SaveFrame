# HTTP bootstrap. After DNS points here, enable HTTPS with the Certbot command in README.md.
# Install in /etc/nginx/sites-available/tiksavemp4 and enable once.
include /etc/nginx/snippets/saveframe-analytics-region.conf;
limit_req_zone $binary_remote_addr zone=tiksave_resolve:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tiksave_download:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=tiksave_traffic:10m rate=60r/m;
server {
    listen 80;
    server_name tiksavemp4.online www.tiksavemp4.online;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    location = /api/analytics/page-view {
        limit_req zone=tiksave_traffic burst=10 nodelay;
        limit_req_status 429;
        access_log off;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/tiksavemp4-proxy.conf;
    }
    location = /api/media/resolve {
        limit_req zone=tiksave_resolve burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/tiksavemp4-proxy.conf;
        proxy_read_timeout 90s;
    }
    location = /api/media/download {
        limit_req zone=tiksave_download burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/tiksavemp4-proxy.conf;
        proxy_read_timeout 90s;
    }
    location /api/media/download/ {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/tiksavemp4-proxy.conf;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/tiksavemp4-proxy.conf;
        proxy_read_timeout 90s;
    }
}
