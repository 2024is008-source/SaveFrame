# Rate-limiting zones for SaveFrame API protection
limit_req_zone $binary_remote_addr zone=resolve_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=download_limit:10m rate=15r/m;

upstream saveframe_backend {
    server saveframe-app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name saveframe.app www.saveframe.app _;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 64k;

    # Health check endpoint
    location = /api/health {
        proxy_pass http://saveframe_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Media Resolution Endpoint
    location = /api/media/resolve {
        limit_req zone=resolve_limit burst=10 nodelay;
        proxy_pass http://saveframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Media Download Job Creation & Stream Delivery
    location /api/media/download {
        limit_req zone=download_limit burst=5 nodelay;
        proxy_pass http://saveframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }

    # Job Polling & Cancellation
    location /api/media/jobs {
        proxy_pass http://saveframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend Application
    location / {
        proxy_pass http://saveframe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
