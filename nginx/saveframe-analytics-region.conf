# Official Cloudflare networks checked 2026-10-30; keep this list maintained.
# Use the original socket peer even when real_ip restores the visitor address.
geo $realip_remote_addr $saveframe_trusted_geo {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map "$saveframe_trusted_geo:$http_cf_ipcountry" $saveframe_analytics_country {
    default XX;
    "~^1:(?<saveframe_country_code>[A-Z]{2})$" $saveframe_country_code;
}
