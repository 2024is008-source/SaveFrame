proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite visitor-supplied forwarding headers at this trusted edge.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Requires saveframe-analytics-region.conf once in the http context. Only a
# verified proxy peer can supply geography; direct/unknown requests become XX.
proxy_set_header X-SaveFrame-Country $saveframe_analytics_country;
